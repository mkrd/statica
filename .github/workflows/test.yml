name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:

  # MARK: Tests job

  tests-job:
    runs-on: alpine-uv

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      #----------------------------------------------
      #---- Checkout and set up Python
      #----------------------------------------------

      - name: Install system dependencies
        run: apk add --no-cache git nodejs just

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      #----------------------------------------------
      #---- Install dependencies
      #----------------------------------------------

      - name: uv install
        run: uv sync --python ${{ matrix.python-version }}

      #----------------------------------------------
      #---- Show installation details
      #----------------------------------------------

      - name: uv --version
        run: uv --version
      - name: uv run python --version
        run: uv run python --version
      - name: ls -lah
        run: ls -lah
      - name: uv tree
        run: uv tree

      #----------------------------------------------
      #---- Linting and Static Analysis
      #----------------------------------------------

      - name: 🔎 Ruff checks
        run: just ruff-check

      - name: 🔎 Ruff format checks
        run: just ruff-format-check

      - name: 🐍 Static Type Checker
        run: just typecheck

      #----------------------------------------------
      #---- Run tests with coverage report
      #----------------------------------------------

      - name: 🚀 Run tests with code coverage report
        run: just test

  # MARK: Badge Job

  cov-badge-job:
    needs: tests-job
    runs-on: alpine-uv
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install git
        run: apk add --no-cache git nodejs

      - name: Checkout repository
        uses: actions/checkout@v7

      #----------------------------------------------
      #---- Generate coverage badge
      #----------------------------------------------

      # The tests run again in this job, so only this job needs write access
      - name: Generate Coverage Badge
        run: |
          uv python install 3.12
          uv sync --python 3.12
          uv run coverage run -m unittest discover
          uv run coverage xml
          uv run --with genbadge[coverage] -- genbadge coverage -i coverage.xml -o assets/coverage.svg

      #----------------------------------------------
      #---- Commit and push if changed
      #----------------------------------------------

      - name: Check if coverage badge changed
        id: badge-diff
        run: |
          git add assets/coverage.svg
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push coverage badge
        if: steps.badge-diff.outputs.changed == 'true'
        run: |
          git config user.name "actions[bot]"
          git config user.email "actions[bot]@users.noreply.com"
          git commit -m "Updated assets/coverage.svg"
          git -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" push origin HEAD:${GITHUB_REF}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
