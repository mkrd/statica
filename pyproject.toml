[project]
name = "statica"
version = "1.6.1"
description = "A minimalistic data validation library"
readme = "README.md"
authors = [{ name = "Marcel Kröker", email = "kroeker.marcel@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Programming Language :: Python",
	"Topic :: Software Development :: Libraries :: Python Modules",
]

##########################################################################################
#### MARK: Dependencies

requires-python = ">=3.11, <3.16"

dependencies = []

[dependency-groups]
dev = ["coverage ~= 7.17.0", "pyrefly ~= 1.4.0", "ruff ~= 0.17.0"]

##########################################################################################
#### MARK: Build System

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

##########################################################################################
#### MARK: Ruff

[tool.ruff]
show-fixes = true
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"ANN202",  # Missing return type annotation for private function
	"ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
	"COM812",  # Missing trailing comma
	"CPY001",  # Missing copyright notice
	"D",       # docstrings
	"ERA001",  # Found commented-out code
	"INP001",  # File is part of an implicit namespace package. Add an `__init__.py`.
	"PLR0913", # Too many arguments in function definition (6 > 5)
	"PT",      # pytest, project uses stdlib unittest
	"S101",    # Use of `assert` detected
	"T201",    # `print` found
	"W191",    # indentation contains tabs
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

############################################################################################
#### MARK: Pyrefly

[tool.pyrefly]
min-severity = "warn"
preset = "strict"
python-version = "3.11"

[tool.pyrefly.errors]
implicit-any-lambda = "ignore"

##########################################################################################
#### MARK: Testing

[tool.coverage.run]
branch = true
data_file = ".cache/coverage"
source = ["statica"]

[tool.coverage.report]
show_missing = true
